name: Deploy BullBear Risk Website to S3

on:
  push:
    branches: [main]
    paths:
      - "risk_website/**"
      - ".github/workflows/cd-risk-website-s3.yaml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

defaults:
  run:
    working-directory: risk_website

jobs:
  build-and-deploy:
    name: Build and deploy risk landing page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Render Django templates and collect static files
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'risk@bbbprediction.com' }}
        run: python manage.py build_landing --output dist

      - name: Validate S3 and CloudFront deployment settings
        env:
          RISK_WEBSITE_BUCKET: ${{ vars.RISK_WEBSITE_BUCKET || 'bullbearprime.com' }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          test -n "$RISK_WEBSITE_BUCKET" || { echo "Missing RISK_WEBSITE_BUCKET."; exit 1; }
          test -n "$CLOUDFRONT_DISTRIBUTION_ID" || { echo "Missing CLOUDFRONT_DISTRIBUTION_ID. Configure the CloudFront distribution first."; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'eu-north-1' }}

      - name: Sync site to S3
        env:
          RISK_WEBSITE_BUCKET: ${{ vars.RISK_WEBSITE_BUCKET || 'bullbearprime.com' }}
        run: |
          aws s3 sync dist/ "s3://$RISK_WEBSITE_BUCKET" --delete --cache-control "public,max-age=300"

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: aws cloudfront create-invalidation --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"

      - name: Deployment summary
        run: |
          echo "BullBear Risk landing page deployed."
          echo "https://bullbearprime.com will serve the updated page after CloudFront invalidation."
