AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Serve the BullBear Risk static site from a private S3 bucket through CloudFront
  with Origin Access Control and optional Route 53 aliases.

Parameters:
  SiteBucketName:
    Type: String
    Default: bullbearprime.com
    Description: Existing dedicated S3 bucket containing the static website.
  SiteBucketRegion:
    Type: String
    Default: eu-north-1
    Description: AWS Region where the existing S3 bucket is located.
  RootDomain:
    Type: String
    Default: bullbearprime.com
  WwwDomain:
    Type: String
    Default: www.bullbearprime.com
  CertificateArn:
    Type: String
    Description: ACM certificate ARN for both domains. CloudFront certificates must be in us-east-1.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Optional existing Route 53 public hosted zone ID. Leave blank to manage DNS elsewhere.

Conditions:
  CreateRoute53Records: !Not [!Equals [!Ref HostedZoneId, ""]]

Resources:
  RiskWebsiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-s3-oac"
        Description: Private S3 access for the BullBear Risk website distribution.
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  RiskWebsiteSecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: Security headers for BullBear Risk static pages.
        SecurityHeadersConfig:
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 31536000
            IncludeSubdomains: false
            Preload: false
            Override: true

  RiskWebsiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        IPV6Enabled: true
        Comment: !Sub "BullBear Risk website for ${RootDomain}"
        Aliases:
          - !Ref RootDomain
          - !Ref WwwDomain
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_All
        Origins:
          - Id: PrivateS3WebsiteOrigin
            DomainName: !Sub "${SiteBucketName}.s3.${SiteBucketRegion}.amazonaws.com"
            OriginAccessControlId: !GetAtt RiskWebsiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: PrivateS3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref RiskWebsiteSecurityHeaders
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

  RiskWebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    Properties:
      Bucket: !Ref SiteBucketName
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowReadOnlyFromThisCloudFrontDistribution
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${SiteBucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${RiskWebsiteDistribution}"

  RootDomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RootDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt RiskWebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  RootDomainAAAARecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref RootDomain
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RiskWebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwDomainARecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomain
      Type: A
      AliasTarget:
        DNSName: !GetAtt RiskWebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

  WwwDomainAAAARecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateRoute53Records
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref WwwDomain
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt RiskWebsiteDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  DistributionId:
    Description: Configure this as the GitHub Actions CLOUDFRONT_DISTRIBUTION_ID variable.
    Value: !Ref RiskWebsiteDistribution
  DistributionDomainName:
    Description: CloudFront hostname targeted by DNS.
    Value: !GetAtt RiskWebsiteDistribution.DomainName
  WebsiteUrl:
    Description: HTTPS website URL after DNS and certificate validation complete.
    Value: !Sub "https://${RootDomain}"
